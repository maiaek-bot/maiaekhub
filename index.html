<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maiaekhub - Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <!-- ฟอร์มเข้าสู่ระบบ -->
        <div id="loginBox">
            <h2>เข้าสู่ระบบ maiaekhub</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้งาน (Username):</label>
                    <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้งาน">
                </div>
                <div class="form-group">
                    <label for="password">รหัสผ่าน:</label>
                    <input type="password" id="password" required placeholder="กรอกรหัสผ่าน">
                </div>
                <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
            </form>
            <p class="switch-text">ยังไม่มีบัญชีใช่ไหม? <a href="#" id="linkToRegister">สมัครสมาชิกที่นี่</a></p>
        </div>

        <!-- ฟอร์มสมัครสมาชิก -->
        <div id="registerBox" style="display: none;">
            <h2>สมัครสมาชิก maiaekhub</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regUsername">ตั้งชื่อผู้ใช้งาน (Username):</label>
                    <input type="text" id="regUsername" required placeholder="กำหนดชื่อผู้ใช้งาน">
                </div>
                <div class="form-group">
                    <label for="regPassword">ตั้งรหัสผ่าน (อย่างน้อย 6 ตัวอักษร):</label>
                    <input type="password" id="regPassword" minlength="6" required placeholder="กำหนดรหัสผ่าน">
                </div>
                <button type="submit" class="btn btn-primary">สมัครสมาชิก</button>
            </form>
            <p class="switch-text">มีบัญชีอยู่แล้ว? <a href="#" id="linkToLogin">เข้าสู่ระบบที่นี่</a></p>
        </div>

        <p id="errorMessage" class="error-text"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
