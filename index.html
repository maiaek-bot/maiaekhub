<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ส่วน Authentication -->
    <div id="auth-section">
        <div class="tabs">
            <button onclick="showLogin()">เข้าสู่ระบบ</button>
            <button onclick="showRegister()">สมัครสมาชิก</button>
        </div>

        <form id="login-form">
            <input type="text" id="login-email" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <form id="register-form" style="display: none;">
            <input type="text" id="register-email" placeholder="Create Username" required>
            <input type="password" id="register-password" placeholder="Create Password" required>
            <button type="submit">Register</button>
        </form>
    </div>

    <!-- ส่วน Dashboard (แสดงผลเมื่อ Login แล้ว) -->
    <div id="dashboard-section" style="display: none;">
        <button id="logout-btn">Logout</button>
        <h2>จัดการสินค้า</h2>
        <form id="product-form">
            <input type="text" id="item-no" placeholder="Item No." required>
            <input type="text" id="description" placeholder="Description" required>
            <input type="text" id="uom" placeholder="UOM" required>
            <button type="submit">บันทึกข้อมูล</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Item No</th>
                    <th>Description</th>
                    <th>UOM</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="product-list"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
