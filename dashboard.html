<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maiaekhub - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">maiaekhub</h1>
            <div class="user-info">
                <span id="userEmail">กำลังโหลดผู้ใช้...</span>
                <span id="userRoleBadge" class="role-badge">User</span>
                <button id="btnLogout" class="btn btn-secondary btn-sm">ออกจากระบบ</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="controls-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ค้นหารหัสสินค้า หรือ ชื่อสินค้า...">
            </div>
            <div class="action-box">
                <button id="btnOpenAddModal" class="btn btn-primary">+ เพิ่มสินค้าใหม่</button>
            </div>
        </section>

        <section class="table-card">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>รหัสสินค้า (Item No.)</th>
                            <th>ชื่อสินค้า (Description)</th>
                            <th>หน่วยนับ</th>
                            <th>ราคาหลัก</th>
                            <th>ผู้จำหน่ายหลัก (Vendor)</th>
                            <th>เงื่อนไข</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr>
                            <td colspan="7" class="text-center">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="table-footer">
                <span id="totalItemsText">รวมทั้งหมด 0 รายการ</span>
            </div>
        </section>
    </main>

    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">เพิ่มสินค้าใหม่</h3>
                <button id="btnCloseModal" class="close-btn">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">

                <div class="form-group">
                    <label for="itemNo">รหัสสินค้า (Item No.) *</label>
                    <input type="text" id="itemNo" required placeholder="เช่น 3MXXK02000508">
                </div>

                <div class="form-group">
                    <label for="description">ชื่อสินค้า (Description) *</label>
                    <input type="text" id="description" required placeholder="เช่น หน้ากากกรองฝุ่น #8210 N95 3M">
                </div>

                <div class="form-row">
                    <div class="form-group col">
                        <label for="uomGroup">หน่วยนับ</label>
                        <input type="text" id="uomGroup" placeholder="ชิ้น, อัน, ตัว, กล่อง">
                    </div>
                    <div class="form-group col">
                        <label for="baseUnitPrice">ราคาหลัก (บาท)</label>
                        <input type="number" step="0.01" id="baseUnitPrice" placeholder="0.00">
                    </div>
                </div>

                <div class="form-group">
                    <label for="preferredVendor">ผู้จำหน่ายหลัก (Preferred Vendor)</label>
                    <input type="text" id="preferredVendor" placeholder="เช่น บริษัท ซีเอสที ซัพพลายส์ จำกัด">
                </div>

                <div class="form-group">
                    <label for="conditionNote">เงื่อนไขเพิ่มเติม (Condition)</label>
                    <textarea id="conditionNote" rows="3" placeholder="ระบุเงื่อนไขส่วนลด หรือหมายเหตุอื่นๆ"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btnCancelModal" class="btn btn-secondary">ยกเลิก</button>
                    <button type="submit" class="btn btn-primary">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
</body>
</html>
