<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Transparent background (no rect = transparent) -->

  <!-- Maze border, pixel style, navy blue -->
  <g fill="#28285A">
    <!-- Top border -->
    <rect x="1" y="1" width="30" height="2"/>
    <!-- Bottom border -->
    <rect x="1" y="29" width="30" height="2"/>
    <!-- Left border -->
    <rect x="1" y="1" width="2" height="30"/>
    <!-- Right border -->
    <rect x="29" y="1" width="2" height="30"/>

    <!-- Top notch details -->
    <rect x="14" y="3" width="2" height="4"/>
    <rect x="22" y="3" width="2" height="6"/>
    <rect x="22" y="7" width="6" height="2"/>

    <!-- Bottom notch details -->
    <rect x="14" y="25" width="2" height="4"/>
    <rect x="6" y="23" width="2" height="6"/>
    <rect x="6" y="23" width="6" height="2"/>
  </g>

  <!-- The M letter, pixel style, gold/yellow with black outline -->
  <g>
    <!-- Black outline block (drawn slightly larger/offset for outline effect) -->
    <path d="M9 9 h4 v6 l3 -3 l3 3 v-6 h4 v14 h-4 v-6 l-3 3 l-3 -3 v6 h-4 z"
          fill="#000000"/>
    <!-- Gold fill, inset by 1px to leave outline -->
    <path d="M10 10 h2 v6.5 l4 -4 l4 4 v-6.5 h2 v12 h-2 v-6.5 l-4 4 l-4 -4 v6.5 h-2 z"
          fill="#F0B429"/>
  </g>
</svg>
