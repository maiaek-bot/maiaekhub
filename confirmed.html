<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันอีเมลสำเร็จ — MaiaekHub</title>
<style>
  :root{
    --bg-0:#0b0f0e;
    --bg-1:#11161a;
    --card:#161c20;
    --card-border:#232b30;
    --text-0:#f2f5f4;
    --text-1:#9aa5a3;
    --mint-0:#5fd9b4;
    --mint-1:#3fc79d;
    --mint-glow:rgba(95,217,180,0.35);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:
      radial-gradient(circle at 18% 15%, rgba(63,199,157,0.16), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(63,199,157,0.10), transparent 45%),
      var(--bg-0);
    color:var(--text-0);
    font-family:'Noto Sans Thai','Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .card{
    width:100%;
    max-width:440px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:44px 36px 36px;
    text-align:center;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(14px);
    animation:riseIn .6s cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes riseIn{
    to{opacity:1; transform:translateY(0);}
  }

  .badge{
    width:76px;
    height:76px;
    margin:0 auto 26px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--mint-0), var(--mint-1));
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 0 8px rgba(95,217,180,0.10), 0 12px 30px -8px var(--mint-glow);
    position:relative;
  }

  .badge svg{
    width:36px;
    height:36px;
    stroke:#0b0f0e;
  }

  .badge .path-check{
    stroke-dasharray:48;
    stroke-dashoffset:48;
    animation:draw .5s ease-out .45s forwards;
  }

  @keyframes draw{
    to{stroke-dashoffset:0;}
  }

  .ring{
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:2px solid var(--mint-0);
    opacity:0;
    animation:pulseRing 1.1s ease-out .15s forwards;
  }

  @keyframes pulseRing{
    0%{transform:scale(0.7); opacity:.9;}
    100%{transform:scale(1.35); opacity:0;}
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:.06em;
    color:var(--mint-0);
    font-weight:600;
    margin-bottom:10px;
  }

  h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 12px;
    line-height:1.35;
    color:var(--text-0);
  }

  p.sub{
    margin:0 0 6px;
    font-size:15px;
    color:var(--text-1);
    line-height:1.7;
  }

  .email-chip{
    display:inline-block;
    margin-top:14px;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(95,217,180,0.08);
    border:1px solid rgba(95,217,180,0.25);
    color:var(--mint-0);
    font-size:13.5px;
    word-break:break-all;
  }

  .divider{
    height:1px;
    background:linear-gradient(to right, transparent, var(--card-border), transparent);
    margin:30px 0 26px;
  }

  .btn-primary{
    display:block;
    width:100%;
    padding:16px 20px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg, var(--mint-0), var(--mint-1));
    color:#0b0f0e;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow:0 10px 24px -10px var(--mint-glow);
  }

  .btn-primary:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
    box-shadow:0 14px 30px -10px var(--mint-glow);
  }

  .btn-primary:active{
    transform:translateY(0px) scale(.99);
  }

  .footnote{
    margin-top:22px;
    font-size:12.5px;
    color:#5c6663;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:28px;
    opacity:.75;
  }

  .brand .mark{
    width:22px;
    height:22px;
    border-radius:7px;
    background:linear-gradient(135deg, var(--mint-0), var(--mint-1));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:12px;
    color:#0b0f0e;
  }

  .brand span{
    font-size:13px;
    color:var(--text-1);
    letter-spacing:.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .path-check, .ring{ animation:none !important; opacity:1 !important; transform:none !important; stroke-dashoffset:0 !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card">
    <div class="badge">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path class="path-check" d="M4 12.5L9.5 18L20 6"/>
      </svg>
    </div>

    <div class="eyebrow">ยืนยันอีเมลสำเร็จ</div>
    <h1>บัญชีของคุณพร้อมใช้งานแล้ว</h1>
    <p class="sub">เราได้ยืนยันอีเมลของคุณเรียบร้อยแล้ว</p>
    <p class="sub">ตอนนี้สามารถเข้าสู่ระบบเพื่อเริ่มใช้งาน MaiaekHub ได้ทันที</p>

    <div class="divider"></div>

    <a href="https://maiaekhub.vercel.app/" class="btn-primary">ไปหน้าเข้าสู่ระบบ</a>

    <div class="footnote">หน้านี้ปิดได้เลย หากปุ่มไม่ทำงานให้กลับไปที่แอปด้วยตนเอง</div>

    <div class="brand">
      <div class="mark">M</div>
      <span>MaiaekHub · ระบบจัดการสินค้าและราคา</span>
    </div>
  </div>
</div>

</body>
</html>
